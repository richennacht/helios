name: CI

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,ml]"
      - run: ruff check .
      - run: pytest --cov=helios --cov=apps --cov-report=term-missing
