[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-solar-scouting"
version = "0.1.0"
description = "Regional solar-site discovery and scouting platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
geo = [
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "rasterio>=1.3,<2",
  "pyproj>=3.6,<4",
  "osmnx>=2.0,<3",
  "pvlib>=0.11,<1",
]
db = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.15,<1",
  "alembic>=1.13,<2",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
ml = [
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pillow>=11,<13",
  "scikit-learn>=1.5,<2",
  "torch>=2.7,<3",
]

[tool.setuptools.packages.find]
include = ["apps*", "helios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
